<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小晞的开销本</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:#f5f6f8;
  color:#333;
}
.container{
  max-width:600px;
  margin:auto;
  padding:20px 15px 40px;
}
h1{
  text-align:center;
  font-size:26px;
  margin:10px 0 20px;
}
.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.summary{
  display:flex;
  gap:10px;
}
.summary div{
  flex:1;
  text-align:center;
  background:#f7f7f7;
  border-radius:12px;
  padding:15px 5px;
}
.summary strong{
  display:block;
  font-size:22px;
  margin-top:5px;
}
label{
  display:block;
  margin:12px 0 6px;
  font-size:14px;
}
input,select,button{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
button{
  margin-top:15px;
  border:0;
  background:#333;
  color:white;
  cursor:pointer;
}
.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #eee;
}
.item:last-child{border-bottom:0}
.info{
  flex:1;
  min-width:0;
}
.category{
  font-weight:bold;
}
.note{
  color:#888;
  font-size:13px;
  margin-top:4px;
}
.amount{
  font-weight:bold;
  margin:0 10px;
  white-space:nowrap;
}
.delete{
  width:auto;
  margin:0;
  padding:7px 10px;
  background:#eee;
  color:#555;
  font-size:13px;
}
.empty{
  text-align:center;
  color:#999;
  padding:20px 0;
}
</style>
</head>

<body>
<div class="container">

<h1>小晞的开销本</h1>

<div class="card summary">
  <div>
    今日支出
    <strong id="todayTotal">¥0.00</strong>
  </div>
  <div>
    总支出
    <strong id="allTotal">¥0.00</strong>
  </div>
</div>

<div class="card">
  <label>日期</label>
  <input type="date" id="date">

  <label>分类</label>
  <select id="category">
    <option>饮食</option>
    <option>外卖</option>
    <option>交通</option>
    <option>衣物</option>
    <option>学习</option>
    <option>娱乐</option>
    <option>礼物红包</option>
    <option>生活用品</option>
    <option>其他</option>
  </select>

  <label>金额</label>
  <input type="number" id="amount" placeholder="请输入金额" step="0.01" min="0">

  <label>备注</label>
  <input type="text" id="note" placeholder="例如：午饭、买书">

  <button onclick="addExpense()">添加支出</button>
</div>

<div class="card">
  <h3>支出记录</h3>
  <div id="list"></div>
</div>

</div>

<script>
let expenses = JSON.parse(localStorage.getItem("xiaoxi-expenses") || "[]");

const dateInput = document.getElementById("date");
const today = new Date().toISOString().slice(0,10);
dateInput.value = today;

function save(){
  localStorage.setItem("xiaoxi-expenses", JSON.stringify(expenses));
}

function addExpense(){
  const date = dateInput.value;
  const category = document.getElementById("category").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const note = document.getElementById("note").value.trim();

  if(!date){
    alert("请选择日期");
    return;
  }

  if(!amount || amount <= 0){
    alert("请输入正确的金额");
    return;
  }

  expenses.unshift({
    id:Date.now(),
    date,
    category,
    amount,
    note
  });

  save();

  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";

  render();
}

function deleteExpense(id){
  if(confirm("确定要删除这笔支出吗？")){
    expenses = expenses.filter(item => item.id !== id);
    save();
    render();
  }
}

function render(){
  const list = document.getElementById("list");

  if(expenses.length === 0){
    list.innerHTML = '<div class="empty">还没有支出记录</div>';
  }else{
    list.innerHTML = expenses.map(item => `
      <div class="item">
        <div class="info">
          <div class="category">${item.category}</div>
          <div class="note">${item.date}${item.note ? " · " + item.note : ""}</div>
        </div>
        <div class="amount">¥${item.amount.toFixed(2)}</div>
        <button class="delete" onclick="deleteExpense(${item.id})">删除</button>
      </div>
    `).join("");
  }

  const todayTotal = expenses
    .filter(item => item.date === today)
    .reduce((sum,item) => sum + item.amount,0);

  const allTotal = expenses
    .reduce((sum,item) => sum + item.amount,0);

  document.getElementById("todayTotal").textContent =
    "¥" + todayTotal.toFixed(2);

  document.getElementById("allTotal").textContent =
    "¥" + allTotal.toFixed(2);
}

render();
</script>

</body>
</html>
